{% extends "base.html" %}
{% block title %}Contacts - Pocket Log Analyzer{% endblock %}
{% block content %}
<div class="dashboard">
    <div class="header-bar">
        <h2>Contacts</h2>
        <div class="header-actions">
            <input type="text" id="friendUsername" placeholder="Search or add by username" style="padding:0.4rem 0.6rem;border:1px solid rgba(128,128,128,0.3);border-radius:6px;background:var(--bg);color:var(--text);font-size:0.8rem;">
            <button class="btn-primary" id="addFriendBtn">+ Add</button>
        </div>
    </div>

    <div id="sentBadge" style="display:none;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.75rem;">📨 Request sent.</div>

    <div class="card" style="padding:0.75rem;margin-bottom:1rem;">
        <h4 style="font-size:0.8rem;font-weight:700;margin-bottom:0.5rem;">📥 Incoming requests</h4>
        <div id="received"></div>
    </div>

    <div class="card" style="padding:0.75rem;margin-bottom:1rem;">
        <h4 style="font-size:0.8rem;font-weight:700;margin-bottom:0.5rem;">👥 Your contacts</h4>
        <div id="friends"></div>
    </div>
</div>
<script>
(async function(){
    const res = await fetch('/flight/api/contacts');
    const data = await res.json();
    const received = document.getElementById('received');
    const friends = document.getElementById('friends');
    const renderReceived = () => {
        if (!data.received.length) { received.innerHTML = '<p style="font-size:0.75rem;color:#aaa;">No pending requests.</p>'; return; }
        received.innerHTML = data.received.map(r =>
            '<div style="display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;padding:0.3rem 0;">' +
            '<span style="flex:1;">' + r.peer_name + '</span>' +
            '<button class="btn-primary" data-a="accept" data-i="' + r.id + '" style="font-size:0.65rem;padding:0.15rem 0.5rem;">Accept</button>' +
            '<button class="btn-primary" data-a="decline" data-i="' + r.id + '" style="font-size:0.65rem;padding:0.15rem 0.5rem;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid rgba(128,128,128,0.2);">Decline</button>' +
            '</div>'
        ).join('');
        received.querySelectorAll('button').forEach(b => b.addEventListener('click', async () => {
            await fetch('/flight/api/contacts/' + b.dataset.i + '/' + b.dataset.a, {method: 'POST'});
            location.reload();
        }));
    };
    const renderFriends = () => {
        if (!data.friends.length) { friends.innerHTML = '<p style="font-size:0.75rem;color:#aaa;">No contacts yet. Add other users of this instance.</p>'; return; }
        friends.innerHTML = data.friends.map(f =>
            '<div style="display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;padding:0.3rem 0;">' +
            '<span style="flex:1;">' + f.username + '</span>' +
            '<a href="/flight/feed" style="font-size:0.65rem;color:var(--accent);">view feed</a>' +
            '<button class="btn-danger" data-i="' + f.id + '" style="font-size:0.65rem;padding:0.15rem 0.5rem;">Remove</button>' +
            '</div>'
        ).join('');
        friends.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', async () => {
            if (!confirm('Remove this contact?')) return;
            await fetch('/flight/api/contacts/' + b.dataset.i, {method: 'DELETE'});
            location.reload();
        }));
    };
    renderReceived();
    renderFriends();

    document.getElementById('addFriendBtn').addEventListener('click', async () => {
        const uname = document.getElementById('friendUsername').value.trim();
        if (!uname) return;
        const usersRes = await fetch('/flight/api/users/search?q=' + encodeURIComponent(uname));
        const all = (await usersRes.json()).users || [];
        const found = all.find(u => u.username === uname);
        if (!found) { alert('No user found with that username.'); return; }
        const res = await fetch('/flight/api/contacts', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: found.id})
        });
        if (res.ok) { document.getElementById('sentBadge').style.display = 'block'; }
        else { const e = await res.json(); alert(e.error || 'Could not send request.'); }
    });
})();
</script>
{% endblock %}
