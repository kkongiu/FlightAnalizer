{% extends "base.html" %}
{% block title %}Audit Log · Pocket Log Analyzer{% endblock %}
{% block content %}
<div class="dashboard">
  <div class="header-bar">
    <h2>Audit Log</h2>
    <div class="header-actions">
      <input id="auditUserFilter" type="text" placeholder="Filter by username..."
             style="padding:0.45rem 0.7rem;border:1px solid rgba(128,128,128,0.25);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:0.8rem;outline:none;width:200px;">
      <select id="auditLimit" style="padding:0.45rem 0.6rem;border:1px solid rgba(128,128,128,0.25);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:0.8rem;">
        <option value="100">100 entries</option>
        <option value="200" selected>200 entries</option>
        <option value="500">500 entries</option>
      </select>
      <button id="auditRefresh" class="btn-primary">Refresh</button>
    </div>
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;font-size:0.8rem;border-collapse:collapse;">
        <thead>
          <tr style="background:rgba(128,128,128,0.08);text-align:left;">
            <th style="padding:0.6rem 0.9rem;font-weight:700;color:var(--text-secondary);">Time</th>
            <th style="padding:0.6rem 0.9rem;font-weight:700;color:var(--text-secondary);">User</th>
            <th style="padding:0.6rem 0.9rem;font-weight:700;color:var(--text-secondary);">Action</th>
            <th style="padding:0.6rem 0.9rem;font-weight:700;color:var(--text-secondary);">Detail</th>
            <th style="padding:0.6rem 0.9rem;font-weight:700;color:var(--text-secondary);">IP</th>
          </tr>
        </thead>
        <tbody id="auditBody">
          <tr><td style="padding:0.6rem 0.9rem;color:var(--text-muted);" colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const ACTION_LABELS = {
  'login': 'Login',
  'login_failed': 'Login failed',
  'logout': 'Logout',
  'register': 'Register',
  'account_activated': 'Email confirmed',
  'account_update': 'Account updated',
  'password_change': 'Password changed',
  'password_reset': 'Password reset',
  'password_reset_link': 'Reset link issued',
  'data_export': 'Data export',
  'account_delete': 'Account deleted',
  'upload': 'Upload',
  'scan': 'Scan folder',
  'reprocess': 'Reprocess',
  'flight_view': 'Flight viewed',
  'flight_delete': 'Flight deleted',
  'flight_export': 'Flight exported',
  'user_create': 'User created',
  'user_update': 'User updated',
  'user_delete': 'User deleted',
  'message_send': 'Message sent',
  'conversation_delete': 'Conversation deleted',
  'message_delete_admin': 'Message deleted (admin)',
  'contact_request': 'Contact request',
  'contact_accept': 'Contact accepted',
  'contact_decline': 'Contact declined',
  'contact_remove': 'Contact removed',
  'group_create': 'Group created',
  'group_update': 'Group updated',
  'group_delete': 'Group deleted',
  'group_member_add': 'Group member added',
  'group_member_remove': 'Group member removed',
  'flight_visibility': 'Visibility changed',
  'flight_group_share': 'Group share changed'
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadAudit() {
  const user = document.getElementById('auditUserFilter').value.trim();
  const limit = document.getElementById('auditLimit').value;
  const params = new URLSearchParams({limit});
  if (user) params.set('username', user);
  const body = document.getElementById('auditBody');
  body.innerHTML = '<tr><td style="padding:0.6rem 0.9rem;color:var(--text-muted);" colspan="5">Loading...</td></tr>';
  try {
    const res = await fetch('/flight/api/audit?' + params.toString());
    if (!res.ok) { body.innerHTML = '<tr><td style="padding:0.6rem 0.9rem;color:var(--danger);" colspan="5">Forbidden</td></tr>'; return; }
    const rows = await res.json();
    if (!rows.length) { body.innerHTML = '<tr><td style="padding:0.6rem 0.9rem;color:var(--text-muted);" colspan="5">No entries</td></tr>'; return; }
    body.innerHTML = rows.map(r => `
      <tr style="border-bottom:1px solid rgba(128,128,128,0.06);">
        <td style="padding:0.5rem 0.9rem;color:var(--text-secondary);white-space:nowrap;">${esc(r.ts)}</td>
        <td style="padding:0.5rem 0.9rem;font-weight:600;color:var(--text);">${esc(r.username || '—')}</td>
        <td style="padding:0.5rem 0.9rem;"><span style="font-size:0.7rem;font-weight:600;padding:0.15rem 0.5rem;border-radius:999px;background:var(--accent-dim);color:var(--accent);">${esc(ACTION_LABELS[r.action] || r.action)}</span></td>
        <td style="padding:0.5rem 0.9rem;color:var(--text-secondary);">${esc(r.detail || '')}</td>
        <td style="padding:0.5rem 0.9rem;color:var(--text-muted);">${esc(r.ip || '')}</td>
      </tr>`).join('');
  } catch(e) {
    body.innerHTML = '<tr><td style="padding:0.6rem 0.9rem;color:var(--danger);" colspan="5">Error loading audit log</td></tr>';
  }
}

document.getElementById('auditRefresh').addEventListener('click', loadAudit);
document.getElementById('auditUserFilter').addEventListener('keydown', e => { if (e.key === 'Enter') loadAudit(); });
document.getElementById('auditLimit').addEventListener('change', loadAudit);
loadAudit();
</script>
{% endblock %}
