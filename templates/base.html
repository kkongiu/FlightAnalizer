<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pocket Log Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="/flight/static/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/flight/static/style.css">
    <link rel="manifest" href="/flight/static/manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="/flight/static/vendor/leaflet.css" />
    <script src="/flight/static/vendor/leaflet.js"></script>
    <script src="/flight/static/vendor/chart.js"></script>
</head>
<body class="font-['Inter']">
    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-gray-900/80 border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/flight/" class="text-lg font-bold text-sky-600 dark:text-sky-400 tracking-tight hover:opacity-80">◈ Pocket Log Analyzer</a>
            <nav class="flex items-center gap-1 text-sm font-medium">
                <a href="/flight/" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Dashboard</a>
                <a href="/flight/flights" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Flights</a>
                <a href="/flight/vehicles" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Vehicles</a>
                <a href="/flight/compare" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Compare</a>
                <a href="/flight/mission" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Missione</a>
                <a href="/flight/report" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Report</a>
                {% if request.session.get('role') == 'admin' %}
                <a href="/flight/users" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Users</a>
                {% endif %}
                <button id="themeToggle" class="ml-1 px-2 py-1.5 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">🌙</button>
                <form method="POST" action="/flight/logout" class="inline">
                    <button type="submit" class="ml-1 px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-gray-200 dark:border-gray-700 py-4 mt-8">
        <p class="text-center text-xs text-gray-400 dark:text-gray-500">Pocket Log Analyzer — FPV Flight Telemetry Dashboard</p>
    </footer>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/flight/static/sw.js');
    }
    (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        const btn = document.getElementById('themeToggle');
        if (btn) {
            btn.addEventListener('click', () => {
                const html = document.documentElement;
                const isDark = html.getAttribute('data-theme') === 'dark';
                html.setAttribute('data-theme', isDark ? '' : 'dark');
                localStorage.setItem('theme', isDark ? '' : 'dark');
                btn.textContent = isDark ? '🌙' : '☀️';
            });
        }
    })();
    </script>
</body>
</html>
