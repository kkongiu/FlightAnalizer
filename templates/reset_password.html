<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Pocket Log Analyzer</title>
    <link rel="stylesheet" href="/flight/static/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-box {
            background: white;
            padding: 3rem 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            width: 340px;
            text-align: center;
        }
        .login-box h1 {
            font-size: 1.5rem;
            color: #1a1a2e;
            margin-bottom: 0.3rem;
        }
        .login-box p {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .login-box input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .login-box input:focus {
            border-color: #0ea5e9;
            outline: none;
        }
        .login-box button {
            width: 100%;
            padding: 0.7rem;
            background: #0ea5e9;
            color: #1a1a2e;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover {
            background: #0284c7;
        }
        .login-box .error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.8rem;
        }
        .login-box .ok {
            color: #16a34a;
            font-size: 0.85rem;
            margin-top: 0.8rem;
        }
        .login-box a {
            color: #0ea5e9;
            font-size: 0.85rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h1>Pocket Log Analyzer</h1>
            <p>Choose a new password</p>
            {% if token %}
            <input type="password" id="pass" placeholder="New password" autocomplete="new-password">
            <input type="password" id="pass2" placeholder="Confirm password" autocomplete="new-password">
            <button id="resetBtn">Reset Password</button>
            {% else %}
            <p>No reset token provided. Use the reset link sent by an administrator.</p>
            {% endif %}
            <div class="ok" id="okMsg"></div>
            <div class="error" id="errorMsg"></div>
            <p style="margin-top:1rem"><a href="/flight/login">Back to sign in</a></p>
        </div>
    </div>
    {% if token %}
    <script>
        document.getElementById('resetBtn').addEventListener('click', async () => {
            const pass = document.getElementById('pass').value;
            const pass2 = document.getElementById('pass2').value;
            const err = document.getElementById('errorMsg');
            const ok = document.getElementById('okMsg');
            err.textContent = '';
            ok.textContent = '';
            if (!pass) { err.textContent = 'Password is required'; return; }
            if (pass !== pass2) { err.textContent = 'Passwords do not match'; return; }
            try {
                const res = await fetch('/flight/api/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: '{{ token }}', password: pass})
                });
                if (res.ok) {
                    ok.textContent = 'Password updated. You can now sign in.';
                    document.getElementById('resetBtn').disabled = true;
                } else {
                    let msg = 'Reset failed';
                    try {
                        const body = await res.json();
                        if (body && body.error) msg = body.error;
                    } catch(e) {}
                    err.textContent = msg;
                }
            } catch(e) {
                err.textContent = 'Connection error';
            }
        });
    </script>
    {% endif %}
</body>
</html>
