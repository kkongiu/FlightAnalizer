services:
  app:
    build: .
    image: pocket-log-analyzer:latest
    container_name: pocket-log-analyzer
    ports:
      - "8000:8000"
    environment:
      POCKET_USER: ${POCKET_USER:-admin}
      POCKET_PASS: ${POCKET_PASS:-changeme}
      POCKET_SESSION_SECRET: ${POCKET_SESSION_SECRET:-}
      POCKET_REGISTRATION: ${POCKET_REGISTRATION:-off}
      POCKET_PUBLIC_URL: ${POCKET_PUBLIC_URL:-}
      POCKET_SMTP_HOST: ${POCKET_SMTP_HOST:-}
      POCKET_SMTP_PORT: ${POCKET_SMTP_PORT:-587}
      POCKET_SMTP_USER: ${POCKET_SMTP_USER:-}
      POCKET_SMTP_PASS: ${POCKET_SMTP_PASS:-}
      POCKET_SMTP_FROM: ${POCKET_SMTP_FROM:-}
      POCKET_DATA_DIR: /data
      POCKET_LOG_DIR: /data/logs
      POCKET_LOG_FILE: /data/logs/app.log
      BACKUP_ENABLED: ${BACKUP_ENABLED:-1}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - ./data:/data
    restart: unless-stopped
